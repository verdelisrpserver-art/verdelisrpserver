<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - Verdelis RP</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a1a2e, #16213e); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; padding: 20px; }
        .container { background: rgba(255,255,255,0.08); padding: 40px; border-radius: 15px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo h1 { color: #e94560; font-size: 2.8rem; }
        .order-summary { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; margin-bottom: 30px; border-left: 4px solid #e94560; }
        .info-item { margin: 12px 0; }
        .info-label { color: #aaa; font-size: 0.9rem; }
        .info-value { font-weight: bold; color: #fff; }
        .player-id { color: #e94560; }
        .btn { padding: 14px; width: 100%; border:none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: #e94560; color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>VERDELIS RP</h1>
            <p>Finalizar Compra</p>
        </div>

        <div class="order-summary">
            <h3>Resumo do Pedido</h3>
            <div id="orderSummary"></div>
        </div>

        <!-- Aqui você pode deixar só o botão ou colocar formulário de cartão se quiser -->
        <div style="text-align:center; padding: 20px; background: rgba(233,69,96,0.1); border-radius: 10px;">
            <p>Ao clicar abaixo você será redirecionado para o pagamento seguro</p>
            <button id="payButton" class="btn btn-primary">IR PARA PAGAMENTO SEGURO</button>
            <button onclick="history.back()" class="btn btn-secondary">Voltar</button>
        </div>
    </div>

    <script>
        // <<< AQUI VOCÊ COLOCA SEU LINK DE PAGAMENTO >>>
        // Exemplos reais:
        // Mercado Pago: https://www.mercadopago.com.br/checkout/v1/redirect?pref_id=123456789
        // PagSeguro: https://pagseguro.uol.com.br/checkout/v2/payment.html?code=ABC123
        // PicPay, Stripe, etc.
        const SEU_LINK_DE_PAGAMENTO = "link.mercadopago.com.br/verdelis"; // <<<< COLOQUE SEU LINK AQUI

        function loadOrderData() {
            const order = JSON.parse(localStorage.getItem('verdelisOrder'));
            if (!order) {
                alert('Erro: dados do pedido não encontrados.');
                window.location.href = 'loja.html';
                return null;
            }

            document.getElementById('orderSummary').innerHTML = `
                <div class="info-item"><span class="info-label">Produto:</span><br><span class="info-value">${order.productName}</span></div>
                <div class="info-item"><span class="info-label">ID do Jogador:</span><br><span class="info-value player-id">${order.playerId}</span></div>
                <div class="info-item"><span class="info-label">Nome no jogo:</span><br><span class="info-value">${order.playerName || 'Não informado'}</span></div>
                <div class="info-item"><span class="info-label">Valor:</span><br><span class="info-value">R$ ${parseFloat(order.price).toFixed(2)}</span></div>
            `;

            return order;
        }

        document.getElementById('payButton').addEventListener('click', function() {
            const order = loadOrderData();
            if (!order) return;

            // Monta a URL com todos os dados que seu gateway precisa
            const params = new URLSearchParams({
                playerId: order.playerId,
                playerName: order.playerName || '',
                product: order.productName,
                valor: order.price,
                email: order.playerName + '@verdelis.com', // opcional
                reference: 'VERDELIS_' + Date.now(),
                success_url: window.location.origin + '/payment-success.html',
                cancel_url: window.location.origin + '/payment-cancel.html'
            });

            const finalUrl = SEU_LINK_DE_PAGAMENTO + '?' + params.toString();
            window.location.href = finalUrl; // Redireciona para o pagamento real
        });

        // Carrega os dados ao abrir a página
        window.onload = loadOrderData;
    </script>
</body>
</html>

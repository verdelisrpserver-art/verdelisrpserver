<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento - Verdelis RP</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #1a1a2e, #16213e); 
            color: #fff; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            background: rgba(255,255,255,0.08); 
            padding: 40px; 
            border-radius: 15px; 
            width: 100%; 
            max-width: 500px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        .logo { 
            text-align: center; 
            margin-bottom: 30px; 
        }
        .logo h1 { 
            color: #e94560; 
            font-size: 2.8rem; 
        }
        .order-summary { 
            background: rgba(255,255,255,0.05); 
            padding: 20px; 
            border-radius: 10px; 
            margin-bottom: 30px; 
            border-left: 4px solid #e94560; 
        }
        .info-item { 
            margin: 12px 0; 
        }
        .info-label { 
            color: #aaa; 
            font-size: 0.9rem; 
        }
        .info-value { 
            font-weight: bold; 
            color: #fff; 
        }
        .player-id { 
            color: #e94560; 
        }
        .btn { 
            padding: 14px; 
            width: 100%; 
            border: none; 
            border-radius: 8px; 
            font-size: 1.1rem; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: all 0.3s ease; 
        }
        .btn-primary { 
            background: #e94560; 
            color: white; 
        }
        .btn-primary:hover { 
            background: #d63447; 
            transform: translateY(-2px); 
        }
        .btn-secondary { 
            background: rgba(255,255,255,0.1); 
            color: white; 
        }
        .btn-secondary:hover { 
            background: rgba(255,255,255,0.2); 
        }
        .loading { 
            display: none; 
            text-align: center; 
            margin-top: 20px; 
            color: #ffd700; 
        }
        .error { 
            color: #ff6b6b; 
            text-align: center; 
            margin-top: 10px; 
            display: none; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>VERDELIS RP</h1>
            <p>Finalizar Compra</p>
        </div>

        <!-- Resumo do Pedido (carregado via JS) -->
        <div class="order-summary">
            <h3>Resumo do Pedido</h3>
            <div id="orderSummary">
                <!-- Conteúdo preenchido pelo JavaScript -->
            </div>
        </div>

        <!-- Botão de Pagamento -->
        <div style="text-align:center; padding: 20px; background: rgba(233,69,96,0.1); border-radius: 10px;">
            <p>Ao clicar abaixo, você será redirecionado para o Mercado Pago (pagamento seguro).</p>
            <p><strong>O valor será preenchido automaticamente!</strong></p>
            <button id="payButton" class="btn btn-primary">IR PARA PAGAMENTO SEGURO</button>
            <button onclick="goBack()" class="btn btn-secondary">Voltar</button>
        </div>

        <!-- Loading e Erro -->
        <div id="loading" class="loading">
            <p>🔄 Redirecionando para o Mercado Pago... Por favor, aguarde.</p>
        </div>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        // <<< AQUI É SEU LINK DO MERCADO PAGO (já configurado) >>>
        // Não mude isso, a menos que tenha um link diferente.
        const MERCADO_PAGO_LINK = "https://link.mercadopago.com.br/verdelis";

        // Função 1: Carrega os dados do pedido do localStorage
        function loadOrderData() {
            const order = JSON.parse(localStorage.getItem('verdelisOrder'));
            if (!order) {
                showError('Erro: Dados do pedido não encontrados. Redirecionando para a loja.');
                setTimeout(() => { window.location.href = 'loja.html'; }, 2000);
                return null;
            }

            // Preenche o resumo na tela
            document.getElementById('orderSummary').innerHTML = `
                <div class="info-item">
                    <span class="info-label">Produto:</span><br>
                    <span class="info-value">${order.productName}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">ID do Jogador:</span><br>
                    <span class="info-value player-id">${order.playerId}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Nome no jogo:</span><br>
                    <span class="info-value">${order.playerName || 'Não informado'}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Valor:</span><br>
                    <span class="info-value">R$ ${parseFloat(order.price).toFixed(2)}</span>
                </div>
            `;

            return order;
        }

        // Função 2: Mostra mensagem de erro
        function showError(message) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        // Função 3: Função para voltar (goBack)
        function goBack() {
            window.location.href = 'player_id.html?' + new URLSearchParams({
                productId: orderData.productId,
                productName: orderData.productName,
                price: orderData.price,
                category: orderData.category
            }).toString();
        }

        // Função 4: Auto-preenche o valor no Mercado Pago e redireciona
        function processPayment(order) {
            // Mostra loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('payButton').disabled = true;

            // Cria uma nova janela para o Mercado Pago
            const mpWindow = window.open(MERCADO_PAGO_LINK, 'MercadoPago', 'width=600,height=800,scrollbars=yes,resizable=yes');

            if (!mpWindow) {
                // Se popup bloqueado, redireciona na mesma aba
                window.location.href = MERCADO_PAGO_LINK;
                return;
            }

            // Espera a página carregar (timeout de 3s para segurança)
            setTimeout(() => {
                try {
                    // Procura o campo de valor no Mercado Pago (seletor comum para links manuais)
                    // Campo típico: input com name="amount" ou placeholder contendo "valor" ou "R$"
                    const amountInput = mpWindow.document.querySelector('input[placeholder*="valor"], input[placeholder*="R$"], input[name="amount"], input[type="number"]');
                    
                    if (amountInput) {
                        // Formata o valor como string brasileira (ex: "50,00")
                        const formattedValue = parseFloat(order.price).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).replace('.', ',');
                        
                        // Insere o valor no campo
                        amountInput.value = formattedValue;
                        
                        // Dispara evento de change para validar
                        amountInput.dispatchEvent(new Event('input', { bubbles: true }));
                        amountInput.dispatchEvent(new Event('change', { bubbles: true }));
                        
                        // Foca no botão de continuar/pagar (seletor comum)
                        const continueBtn = mpWindow.document.querySelector('button[type="submit"], button[onclick*="continuar"], .btn-primary');
                        if (continueBtn) {
                            continueBtn.focus();
                            // Opcional: Clica automaticamente (mas Mercado Pago pode bloquear por segurança)
                            // continueBtn.click();
                        }
                        
                        console.log(`✅ Valor ${formattedValue} auto-preenchido no Mercado Pago!`);
                    } else {
                        console.warn('⚠️ Campo de valor não encontrado. Usuário precisará digitar manualmente.');
                    }
                } catch (e) {
                    console.error('Erro ao auto-preencher:', e);
                    // Fallback: Nada quebra, usuário vê a página normal
                }

                // Fecha loading após 2s
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('payButton').disabled = false;
                }, 2000);

                // Limpa localStorage após sucesso (opcional, para evitar reuso)
                localStorage.removeItem('verdelisOrder');

            }, 3000);  // 3s para a página carregar
        }

        // Função 5: Evento do botão de pagamento
        document.addEventListener('DOMContentLoaded', function() {
            const payBtn = document.getElementById('payButton');
            let orderData = null;

            // Carrega dados na inicialização
            orderData = loadOrderData();

            // Clique no botão
            payBtn.addEventListener('click', function() {
                if (!orderData) {
                    showError('Erro ao carregar pedido. Tente novamente.');
                    return;
                }
                processPayment(orderData);
            });
        });

        // Função 6: Limpeza no unload (opcional)
        window.addEventListener('beforeunload', function() {
            localStorage.removeItem('verdelisOrder');
        });
    </script>
</body>
</html>
